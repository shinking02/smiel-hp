name: "[WC] Terraform plan"

on:
  workflow_call:
    inputs:
      organization:
        description: "Terraform Cloud organization"
        required: true
        type: string
      workspace:
        description: "Terraform Cloud workspace to plan against"
        required: true
        type: string
    secrets:
      TF_API_TOKEN:
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The tfc-workflows actions read these from the environment, not from inputs.
    env:
      TF_CLOUD_ORGANIZATION: ${{ inputs.organization }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: upload
        with:
          workspace: ${{ inputs.workspace }}
          directory: infra
          speculative: true

      - uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: run
        with:
          workspace: ${{ inputs.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true
          message: "Speculative plan from GitHub Actions ${{ github.sha }}"

      - name: Fail unless the plan finished cleanly
        if: steps.run.outputs.run_status != 'planned_and_finished'
        run: |
          echo "Run status: ${{ steps.run.outputs.run_status }}"
          echo "${{ steps.run.outputs.run_link }}"
          exit 1
