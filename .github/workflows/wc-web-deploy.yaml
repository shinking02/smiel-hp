# This workflow owns the runner and the credentials; the package's deploy script
# owns the steps that turn its source into a deployed worker.

name: "[WC] Web deploy"

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment and wrangler environment to target"
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      # Declared only so the expressions type-check. The job selects an environment,
      # and GitHub resolves these from that environment's secrets instead.
      MICROCMS_API_KEY:
        required: false
      TURNSTILE_SECRET_KEY:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Selecting the environment here, rather than in the caller, is what lets this
    # job read its scoped variables and secrets directly.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: ${{ inputs.environment }}
          SITE_URL: ${{ vars.SITE_URL }}
          MICROCMS_SERVICE_DOMAIN: ${{ vars.MICROCMS_SERVICE_DOMAIN }}
          CONTACT_FROM_ADDRESS: ${{ vars.CONTACT_FROM_ADDRESS }}
          CONTACT_TO_ADDRESS: ${{ vars.CONTACT_TO_ADDRESS }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: pnpm --filter "@smiel-hp/web" run ci:deploy
